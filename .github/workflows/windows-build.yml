name: Windows build

# Real Windows verification for M7: a native windows-latest runner builds
# and bundles the actual NSIS installer, sidestepping the Fedora NSIS
# stub-naming mismatch that blocks bundling from the Linux dev container
# (see modsync/Session-2026-08-01-Handoff.md in the vault for the full
# story). Manual trigger is included so this can be run on demand without
# needing a push first.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # createUpdaterArtifacts is on in tauri.conf.json, so every
          # `tauri build` needs this to sign the updater bundle now, even
          # this plain verification build that doesn't publish anything.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: modsync-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
