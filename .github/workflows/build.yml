name: Build

# Verification build for both platforms modsync targets (v1 scope is
# Linux + Windows only, macOS explicitly deprioritized). Windows sidesteps
# the Fedora NSIS stub-naming mismatch that blocks bundling from the
# Linux dev container (see modsync/Session-2026-08-01-Handoff.md in the
# vault for that story) by building on a native windows-latest runner.
# Manual trigger is included so this can be run on demand without needing
# a push first.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: modsync-windows-installer
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: ubuntu-latest
            artifact-name: modsync-linux-appimage
            artifact-path: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # createUpdaterArtifacts is on in tauri.conf.json, so every
          # `tauri build` needs this to sign the updater bundle now, even
          # this plain verification build that doesn't publish anything.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
