name: Release

# Publishes a real GitHub Release with installers for both platforms
# modsync targets (Linux AppImage + Windows NSIS/MSI), signed updater
# artifacts, and a latest.json manifest -- this is what the app's updater
# endpoint (tauri.conf.json > plugins.updater.endpoints) actually reads
# from. Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Both platform jobs publish to the same tag/release -- tauri-action
# appends assets to an existing release of that name rather than creating
# duplicates, so the one release ends up with both platforms' installers.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "modsync ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
